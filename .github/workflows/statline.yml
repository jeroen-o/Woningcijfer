name: StatLine verversen
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CBS-tabellen ophalen
        run: python3 scripts/fetch_statline.py --uit data/cbs
      - name: Wijzigingen vastleggen en publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/cbs)" ]; then
            echo "Geen wijzigingen in data/cbs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cbs
          git commit -m "StatLine-momentopname verversen"
          git push
          gh workflow run pages.yml --ref main
      - name: Falen als een onderwerp ontbreekt
        run: python3 -c "import json,sys; m=json.load(open('data/cbs/manifest.json')); sys.exit(1 if m.get('mislukt') else 0)"
